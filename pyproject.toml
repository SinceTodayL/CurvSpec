[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curvspec"
version = "1.0.0"
description = "CurvSpec: Adaptive Multi-Curvature Learning for Partial Relevant Video Retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "h5py>=3.8",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.0",
    "tqdm>=4.65",
]

[project.scripts]
curvspec = "curvspec.command:main"

[tool.setuptools.packages.find]
where = ["src"]
